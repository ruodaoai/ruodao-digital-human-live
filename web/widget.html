<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>数字人接待</title>
  <link rel="icon" href="data:," />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: transparent; }
    body { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; display: flex; align-items: flex-end; justify-content: center; }
    .card {
      width: 100%; height: 100%; max-width: 400px; max-height: 640px;
      display: flex; flex-direction: column;
      background: #0d0f18; color: #eef0ff;
      border: 1px solid rgba(255,255,255,.08); border-radius: 18px; overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,.4);
    }
    /* 数字人舞台 */
    .stage { position: relative; height: 300px; flex: none; overflow: hidden; background: radial-gradient(120% 90% at 50% 15%, color-mix(in srgb, var(--accent,#7c5cff) 26%, #10121c), #07080d 75%); }
    .d-base, .d-mouth { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: center top; opacity: 0; transition: opacity .2s; }
    .d-mouth { clip-path: inset(var(--mouth-top,58%) var(--mouth-right,26%) var(--mouth-bottom,14%) var(--mouth-left,26%)); transform-origin: 50% var(--mouth-origin,74%); will-change: transform; }
    .stage.has-avatar .d-base, .stage.has-avatar .d-mouth { opacity: 1; }
    .stage-empty { position: absolute; inset: 0; display: grid; place-items: center; font-size: 64px; opacity: .8; }
    .stage.has-avatar .stage-empty { display: none; }
    .stage-top { position: absolute; top: 10px; left: 12px; z-index: 3; display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.42); padding: 5px 11px; border-radius: 999px; backdrop-filter: blur(6px); }
    .live { width: 8px; height: 8px; border-radius: 50%; background: #35d07f; box-shadow: 0 0 0 3px rgba(53,208,127,.28); }
    .stage-top strong { font-size: 13px; }
    .stage-top .tag { font-size: 11px; color: rgba(255,255,255,.6); }
    .subtitle { position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 3; font-size: 13px; line-height: 1.5; background: rgba(0,0,0,.6); padding: 8px 12px; border-radius: 10px; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; }
    .subtitle.on { opacity: 1; transform: translateY(0); }
    .gate { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; background: rgba(5,6,10,.62); backdrop-filter: blur(3px); transition: opacity .3s; }
    .gate.hidden { opacity: 0; pointer-events: none; }
    .gate button { font-size: 15px; padding: 12px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); color: #fff; cursor: pointer; background: linear-gradient(135deg, var(--accent,#7c5cff), #4f8cff); box-shadow: 0 12px 34px rgba(124,92,255,.4); }
    .gate p { font-size: 12px; color: rgba(255,255,255,.55); margin-top: 10px; }
    .gate-wrap { text-align: center; }
    /* 状态条 */
    .statusbar { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-top: 1px solid rgba(255,255,255,.06); border-bottom: 1px solid rgba(255,255,255,.06); background: #0b0d15; font-size: 12px; color: rgba(255,255,255,.62); }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #8b90a8; flex: none; }
    .dot.on { background: #35d07f; box-shadow: 0 0 0 3px rgba(53,208,127,.2); }
    .dot.wait { background: #f5c66b; box-shadow: 0 0 0 3px rgba(245,198,107,.18); }
    .dot.off { background: #6b7086; }
    .statusbar #statusText { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .end-btn { flex: none; border: 1px solid rgba(255,255,255,.14); background: transparent; color: rgba(255,255,255,.62); font-size: 11px; padding: 4px 9px; border-radius: 999px; cursor: pointer; }
    .end-btn:hover { color: #fff; border-color: rgba(255,255,255,.3); }
    /* 对话 */
    .msgs { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 84%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.55; word-break: break-word; white-space: pre-wrap; }
    .bot { align-self: flex-start; background: #1b1f2e; border-bottom-left-radius: 4px; }
    .user { align-self: flex-end; background: var(--accent, #7c5cff); color: #fff; border-bottom-right-radius: 4px; }
    .system { align-self: center; max-width: 92%; text-align: center; font-size: 11.5px; line-height: 1.5; color: #f5c66b; background: rgba(245,198,107,.08); border: 1px solid rgba(245,198,107,.16); padding: 6px 10px; border-radius: 999px; }
    .typing { flex: none; padding: 0 14px 8px; font-size: 12px; color: rgba(255,255,255,.45); }
    .typing[hidden] { display: none; }
    form { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid rgba(255,255,255,.08); background: #0b0d15; }
    input { flex: 1; min-width: 0; height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: #141827; color: #fff; font-size: 14px; }
    input:focus { outline: none; border-color: var(--accent,#7c5cff); }
    button.send { height: 40px; padding: 0 16px; border-radius: 10px; border: 0; cursor: pointer; color: #fff; font-size: 14px; background: linear-gradient(135deg, var(--accent,#7c5cff), #4f8cff); }
    .mic { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(255,255,255,.12); background: #141827; color: #cfd3ff; font-size: 17px; cursor: pointer; }
    .mic.on { border-color: #ff5d7a; color: #ff5d7a; animation: micPulse 1.1s infinite; }
    @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,93,122,.35); } 50% { box-shadow: 0 0 0 6px rgba(255,93,122,0); } }
    .quick { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 8px; }
    .quick:empty { display: none; }
    .quick button { font-size: 12px; padding: 6px 11px; border-radius: 999px; border: 1px solid rgba(255,255,255,.15); background: #141827; color: #cfd3ff; cursor: pointer; font-family: inherit; }
    .quick button:hover { border-color: var(--accent,#7c5cff); color: #fff; }
    .footer { flex: none; text-align: center; font-size: 11px; color: rgba(255,255,255,.3); padding: 5px 0 7px; }
    @media (max-width: 430px) {
      .card { max-height: none; height: 100%; border-radius: 0; border: 0; }
      .stage { height: 34vh; min-height: 210px; }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="stage" id="stage">
      <img class="d-base" id="dBase" alt="" />
      <img class="d-mouth" id="dMouth" alt="" />
      <div class="stage-empty" id="stageEmpty">🤖</div>
      <div class="stage-top"><span class="live"></span><strong id="pname">数字人</strong><span class="tag" id="ptag">在线</span></div>
      <div class="subtitle" id="subtitle"></div>
      <div class="gate" id="gate"><div class="gate-wrap"><button type="button" id="gateBtn">🔊 点击开始接待</button><p>浏览器需一次点击授权声音</p></div></div>
    </div>
    <div class="statusbar">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">正在连接接待…</span>
      <button type="button" class="end-btn" id="endBtn" hidden>结束接待</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="typing" id="typing" hidden>数字人正在回答…</div>
    <div class="quick" id="quick"></div>
    <form id="form">
      <button type="button" class="mic" id="mic" title="语音输入">🎤</button>
      <input id="q" autocomplete="off" placeholder="输入问题，或点麦克风说话…" />
      <button class="send" type="submit">发送</button>
    </form>
    <div class="footer" id="footer">Powered by 若道数字人</div>
  </div>
  <script type="module" src="widget.mjs?v=0.8.0"></script>
</body>
</html>
